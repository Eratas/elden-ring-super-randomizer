; loot_variants.ini - optional settings for loot_variants.dll (Mod Engine native mod).
;
; Every key is optional.  A missing key keeps the value the randomizer wrote into
; loot_variants.txt, so a run made with --loot-rarity legendary stays legendary unless you
; deliberately override it here.  To override a roll setting, remove its leading semicolon.

[general]
enabled = 1                 ; 0 = load the DLL but leave the game untouched
log = 1                     ; loot_variants.log is written next to this DLL
; seed = 12345              ; 0 or omitted = a fresh seed every launch
; manifest = loot_variants.txt   ; absolute path, or a path relative to this DLL

[roll]
; The values below are shown as the manifest defaults.  Uncomment to force them for every run.
; affinity = 1              ; 1 = reroll the affinity (stats, scaling, status build-up)
; level = 1                 ; 1 = reroll the upgrade level from 0 to the weapon's ceiling
; ash_chance = 50           ; 0..100 percent chance of mounting a random Ash of War
; level_curve = common      ; even | common | legendary (same curves as --loot-rarity)
