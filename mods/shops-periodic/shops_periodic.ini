; shops_periodic.ini - optional settings for shops_periodic.dll (Mod Engine native mod).
;
; The randomizer writes shops_periodic.txt next to regulation.bin when --random-shop-stock is on.
; Copy that manifest next to the DLL (or next to regulation.bin) before launching the game.
; Every key is optional: a missing key uses the value from the manifest or the default below.

[general]
enabled = 1                 ; 0 = load the DLL but never reroll
every_minutes = 15          ; reroll interval while the game is running (manifest can carry a default)
; seed = 12345              ; 0 or omitted = a fresh seed every launch
; manifest = shops_periodic.txt  ; absolute path, or a path relative to this DLL
