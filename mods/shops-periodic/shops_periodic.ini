; shops_periodic.ini - optional settings for shops_periodic.dll (Mod Engine native mod).
;
; The randomizer writes shops_periodic.txt into its output folder and, with Backup and replace,
; copies it beside regulation.bin automatically.  The DLL reads it from dll/offline or <mod>\mod.
; Every key is optional: a missing key uses the value from the manifest or the default below.

[general]
enabled = 1                 ; 0 = load the DLL but never reroll
every_minutes = 15          ; reroll interval while the game is running (manifest can carry a default)
; seed = 12345              ; 0 or omitted = a fresh seed every launch
; manifest = shops_periodic.txt  ; absolute path, or a path relative to this DLL

; ---------------------------------------------------------------------------
; [param] - the in-memory ShopLineupParam write, OFF until you verify the geometry.
;
; These are game-build specific.  The DLL never guesses them: without aob + row_count + row_stride
; it only prints the periodic tick and never touches game data.  Find a candidate AOB with
;   python tools\verify_aobs.py --pattern "48 8b ?? ???????? ..."
; then set the values below and confirm in-game that `armed:` appears in the log.  A wrong geometry
; is fail-soft: the log says why no rows were indexed and nothing is written.
;
; aob              hex bytes with ?? wildcards, scanned in the game's executable sections
; aob_disp         -1 = the match is the row-array pointer; >= 0 = disp32 at match+offset
; deref            1 = the resolved address is a singleton slot; follow it once to get the object
;                  (use 1 with the verified ParamRepository AOB from verify_aobs.py)
; rows_offset      bytes from the resolved pointer to the first row entry
; row_count        how many row entries to index (required, > 0)
; row_stride       bytes between row entries (required, > 0)
; row_pointer      1 = entries point at rows, 0 = rows are stored inline
; id_offset        byte offset of the u32 row id inside a row (default 0)
; equip_id_offset  byte offset of the u32 equipId inside a row (default 8, the param-file layout)
;
;[param]
;aob =
;aob_disp = -1
;deref = 0
;rows_offset = 0
;row_count = 0
;row_stride = 0
;row_pointer = 1
;id_offset = 0
;equip_id_offset = 8
