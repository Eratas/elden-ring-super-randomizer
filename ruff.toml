# Lint standard for the randomizer.
#
# pyflakes (F) catches undefined / unused names (e.g. an annotation that references a module that
# was never imported, a local assigned but never read); E9 catches syntax and runtime errors; I
# (isort) keeps import blocks sorted; UP (pyupgrade) flags pre-3.10 idioms; E402 keeps module
# imports at the top of the file; W (pycodestyle warnings) catches trailing whitespace and missing
# newlines; B (bugbear) catches likely bugs (raise-without-from, unused loop vars, ...); C4
# (comprehensions) flags needless dict/set rebuilds; SIM (simplify) flags collapsible branches and
# unclosed files.  This matches tools/lint.py and tools/gate.py, so a bare `ruff check tools/` agrees.
#
# The CLI and test modules put sys.path.insert ahead of their imports so they run from a source
# checkout - each of those late imports carries an explicit `# noqa: E402` saying why.
[lint]
select = ["F", "E9", "I", "UP", "E402", "W", "B", "C4", "SIM", "PLW2901"]
# B905 (zip without strict=): several zips intentionally truncate (the BND4 rebuild zips the file
#   list against the data list), so strict would turn a length mismatch into a hard error.
# SIM105 (try/except/pass -> contextlib.suppress): the bare except/pass is the project's deliberate
#   fail-soft idiom (a missing vendor degrades, it does not crash); wrapping it adds noise, not safety.
ignore = ["B905", "SIM105"]